# SellerChat CI — the robot builder.
#
# WHAT THIS IS (your vocabulary): CI/CD = "every time code changes, a robot
# builds the app by itself." You push a commit → GitHub builds the APKs →
# you download them from the Actions tab. No Android Studio needed on your PC.
#
# It builds BOTH:
#   - app-debug.apk    → install and test the app.
#   - app-release.apk  → the size-measurement build (minified with R8). CI
#     signs it with a throwaway key made on the runner, ONLY so the file is
#     a real installable APK whose size can be measured. It is NOT your
#     release key — the real store build uses your own key / Play App Signing.

name: Build APK

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already has the Android SDK. We only accept the
      # SDK licenses and make sure the exact packages this app needs exist.
      # (We do NOT use android-actions/setup-android — it is broken: it tries
      # to install a 'tools' package Google removed, and fails the build.)
      - name: Prepare Android SDK
        run: |
          TOOLS_DIR=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/ | head -n 1)
          echo "sdkmanager at: $TOOLS_DIR"
          yes | "${TOOLS_DIR}bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${TOOLS_DIR}bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Throwaway keystore for the CI release build (size measurement only).
      - name: Generate CI-only keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/ci.keystore" \
            -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=SellerChat CI, O=CI, C=PK"

      - name: Build the app (debug + release APK)
        env:
          SELLERCHAT_DEBUG_KEYSTORE: ${{ runner.temp }}/ci.keystore
        run: gradle :app:assembleDebug :app:assembleRelease

      - name: Report APK sizes
        run: |
          echo "=== APK SIZE REPORT (budget: release < 5 MB = 5000000 bytes) ==="
          ls -la app/build/outputs/apk/debug/ app/build/outputs/apk/release/
          for f in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f")
              echo "$f -> $SIZE bytes"
            fi
          done

      - name: Upload the installable files
        uses: actions/upload-artifact@v4
        with:
          name: SellerChat-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
